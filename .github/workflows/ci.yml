name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy && git diff --exit-code go.mod go.sum

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./...
      # Workflows that only run on tags (release.yml) are otherwise first
      # validated when a release is cut.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

  # Short fuzz runs of the parsers that decide hold vs pass. Longer runs:
  # go test ./internal/rules -run '^$' -fuzz FuzzEvaluate -fuzztime 10m
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: fuzz
        run: |
          set -e
          for pkg in ./internal/rules ./internal/sqlclass ./internal/pgguard ./internal/myguard ./internal/proxy; do
            for f in $(go test "$pkg" -list '^Fuzz' | grep '^Fuzz' || true); do
              echo "== $pkg $f"
              go test "$pkg" -run '^$' -fuzz "^${f}\$" -fuzztime 30s
            done
          done

  # The real binary, the way users run it: twokey up + an agent through
  # twokey run + a human answering in the up window (and a real Postgres
  # behind twokey pg on Linux).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Start Postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 55432:5432 postgres:17
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          echo "TWOKEY_E2E_PG=127.0.0.1:55432" >> "$GITHUB_ENV"
      - run: go test -tags e2e -count=1 -v ./e2e/

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
