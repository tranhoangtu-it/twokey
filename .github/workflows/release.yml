name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # keyless cosign signature + provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on homebrew-tap and scoop-bucket. Without it
          # the tap/bucket upload is skipped and the GitHub release still succeeds.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Install the release the way users do and run it. Brew and scoop can only
  # install a published release, so this alarms (failed job + issue) rather
  # than gates; the fix is a patch release.
  smoke:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, channel: brew }
          - { os: ubuntu-latest, channel: brew }
          - { os: windows-latest, channel: scoop }
          - { os: ubuntu-latest, channel: go }
          - { os: windows-latest, channel: go }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    env:
      TWOKEY_HOME: ${{ runner.temp }}/twokey-home
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.channel == 'go'
        with:
          go-version: stable
      - name: Install with brew
        if: matrix.channel == 'brew'
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || /opt/homebrew/bin/brew shellenv)"
          brew install --cask tranhoangtu-it/tap/twokey
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install with scoop
        if: matrix.channel == 'scoop'
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
          $shims = Join-Path $env:USERPROFILE 'scoop\shims'
          & (Join-Path $shims 'scoop.cmd') bucket add twokey https://github.com/tranhoangtu-it/scoop-bucket
          & (Join-Path $shims 'scoop.cmd') install twokey
          $shims | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install with go install
        if: matrix.channel == 'go'
        shell: bash
        run: |
          go install "github.com/tranhoangtu-it/twokey/cmd/twokey@${GITHUB_REF_NAME}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the installed binary
        shell: bash
        run: |
          twokey version | tee version.txt
          grep -q "${GITHUB_REF_NAME#v}" version.txt
          twokey replay pocketos
      - name: Open an issue when an install channel is broken
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Install channel '${{ matrix.channel }}' broken on ${{ matrix.os }} for ${GITHUB_REF_NAME}" \
            --body "Release smoke test failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
