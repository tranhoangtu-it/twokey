provider: cloudflare
docs: https://developers.cloudflare.com/api/
rules:
  - id: cloudflare.zone.delete
    hosts: [api.cloudflare.com]
    methods: [DELETE]
    path: /client/v4/zones/{zone}
    resource: "{zone}"
    severity: critical
    message: Deletes a Cloudflare zone (the whole domain configuration).
  - id: cloudflare.dns-record.delete
    hosts: [api.cloudflare.com]
    methods: [DELETE]
    path: /client/v4/zones/{zone}/dns_records/{record}
    resource: "{zone}/{record}"
    severity: high
    message: Deletes a DNS record.
  - id: cloudflare.d1.delete
    hosts: [api.cloudflare.com]
    methods: [DELETE]
    path: /client/v4/accounts/{account}/d1/database/{database}
    resource: "{database}"
    severity: critical
    message: Deletes a D1 database.
  - id: cloudflare.r2.delete-bucket
    hosts: [api.cloudflare.com]
    methods: [DELETE]
    path: /client/v4/accounts/{account}/r2/buckets/{bucket}
    resource: "{bucket}"
    severity: critical
    message: Deletes an R2 bucket.
  - id: cloudflare.worker.delete
    hosts: [api.cloudflare.com]
    methods: [DELETE]
    path: /client/v4/accounts/{account}/workers/scripts/{script}
    resource: "{script}"
    severity: high
    message: Deletes a Worker script.
