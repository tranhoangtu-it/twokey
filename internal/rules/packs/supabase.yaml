provider: supabase
docs: https://supabase.com/docs/reference/api
rules:
  - id: supabase.project.delete
    hosts: [api.supabase.com]
    methods: [DELETE]
    path: /v1/projects/{ref}
    resource: "{ref}"
    severity: critical
    message: Deletes a Supabase project including its Postgres database.
  - id: supabase.branch.delete
    hosts: [api.supabase.com]
    methods: [DELETE]
    path: /v1/branches/{branch}
    resource: "{branch}"
    severity: high
    message: Deletes a Supabase database branch.
  - id: supabase.branch.reset
    hosts: [api.supabase.com]
    methods: [POST]
    path: /v1/branches/{branch}/reset
    resource: "{branch}"
    severity: critical
    message: Resets a Supabase database branch, wiping its data.
