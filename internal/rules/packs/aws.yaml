provider: aws
docs: https://docs.aws.amazon.com/
rules:
  - id: aws.rds.delete
    hosts: ["rds.*.amazonaws.com", rds.amazonaws.com, "rds-fips.*.amazonaws.com", "rds.*.api.aws"]
    aws: { actions: [DeleteDBInstance, DeleteDBCluster] }
    resource: "{DBInstanceIdentifier|DBClusterIdentifier}"
    severity: critical
    message: Deletes an RDS database. Check SkipFinalSnapshot before approving.
  - id: aws.rds.delete-snapshot
    hosts: ["rds.*.amazonaws.com", rds.amazonaws.com, "rds-fips.*.amazonaws.com", "rds.*.api.aws"]
    aws: { actions: [DeleteDBSnapshot, DeleteDBClusterSnapshot] }
    resource: "{DBSnapshotIdentifier|DBClusterSnapshotIdentifier}"
    severity: critical
    message: Deletes an RDS backup snapshot.
  - id: aws.ec2.terminate
    hosts: ["ec2.*.amazonaws.com", ec2.amazonaws.com, "ec2-fips.*.amazonaws.com", "ec2.*.api.aws"]
    aws: { actions: [TerminateInstances, DeleteVolume, DeleteSnapshot] }
    resource: "{InstanceId.1|VolumeId|SnapshotId}"
    severity: critical
    message: Terminates EC2 instances or deletes EBS volumes/snapshots.
  - id: aws.dynamodb.delete
    # <account-id>.ddb.<region>.amazonaws.com is the account-based endpoint recent SDKs use.
    hosts: ["dynamodb.*.amazonaws.com", "dynamodb-fips.*.amazonaws.com", "dynamodb.*.api.aws", "*.ddb.*.amazonaws.com"]
    aws: { actions: [DeleteTable, DeleteBackup] }
    resource: "{TableName|BackupArn}"
    severity: critical
    message: Deletes a DynamoDB table or backup.
  - id: aws.cloudformation.delete-stack
    hosts: ["cloudformation.*.amazonaws.com", "cloudformation-fips.*.amazonaws.com", "cloudformation.*.api.aws"]
    aws: { actions: [DeleteStack] }
    resource: "{StackName}"
    severity: critical
    message: Deletes a CloudFormation stack and every resource it manages.
  - id: aws.secretsmanager.delete
    hosts: ["secretsmanager.*.amazonaws.com", "secretsmanager-fips.*.amazonaws.com", "secretsmanager.*.api.aws"]
    aws: { actions: [DeleteSecret] }
    resource: "{SecretId}"
    severity: critical
    message: Deletes a Secrets Manager secret (immediately with ForceDeleteWithoutRecovery).
  - id: aws.ecr.delete-repository
    hosts: ["api.ecr.*.amazonaws.com", "ecr.*.amazonaws.com", "ecr-fips.*.amazonaws.com", "ecr.*.api.aws"]
    aws: { actions: [DeleteRepository] }
    resource: "{repositoryName}"
    severity: critical
    message: Deletes an ECR repository (all images when force=true).
  - id: aws.route53.delete-hosted-zone
    hosts: [route53.amazonaws.com]
    methods: [DELETE]
    path: /{version}/hostedzone/{zone}
    resource: "{zone}"
    severity: critical
    message: Deletes a Route 53 hosted zone.
  - id: aws.s3.delete-bucket
    hosts: ["*.s3.amazonaws.com", "*.s3.*.amazonaws.com", "*.s3-*.amazonaws.com"]
    methods: [DELETE]
    path: /
    unless_query: &s3subresources [policy, lifecycle, cors, website, tagging, encryption, replication, ownershipControls, publicAccessBlock, analytics, metrics, inventory, intelligent-tiering, metadataTable, metadataConfiguration]
    resource: "{host}"
    severity: critical
    message: Deletes an S3 bucket (virtual-hosted style).
  - id: aws.s3.delete-bucket-path-style
    # s3express-control.<region> is the path-style-only endpoint for directory buckets.
    hosts: [s3.amazonaws.com, "s3.*.amazonaws.com", "s3-*.amazonaws.com", "s3express-control.*.amazonaws.com"]
    methods: [DELETE]
    path: /{bucket}
    unless_query: *s3subresources
    resource: "{bucket}"
    severity: critical
    message: Deletes an S3 bucket (path style).
  - id: aws.lambda.delete-function
    hosts: ["lambda.*.amazonaws.com", "lambda-fips.*.amazonaws.com", "lambda.*.api.aws"]
    methods: [DELETE]
    path: /{version}/functions/{function}
    resource: "{function}"
    severity: high
    message: Deletes a Lambda function.
  - id: aws.eks.delete-cluster
    hosts: ["eks.*.amazonaws.com", "eks-fips.*.amazonaws.com", "eks.*.api.aws"]
    methods: [DELETE]
    path: /clusters/{cluster}
    resource: "{cluster}"
    severity: critical
    message: Deletes an EKS cluster.
  - id: aws.efs.delete-file-system
    hosts: ["elasticfilesystem.*.amazonaws.com", "elasticfilesystem-fips.*.amazonaws.com", "elasticfilesystem.*.api.aws"]
    methods: [DELETE]
    path: /{version}/file-systems/{filesystem}
    resource: "{filesystem}"
    severity: critical
    message: Deletes an EFS file system and all of its files.
  - id: aws.elasticache.delete
    hosts: ["elasticache.*.amazonaws.com", "elasticache-fips.*.amazonaws.com", "elasticache.*.api.aws"]
    aws: { actions: [DeleteCacheCluster, DeleteReplicationGroup, DeleteServerlessCache] }
    resource: "{CacheClusterId|ReplicationGroupId|ServerlessCacheName}"
    severity: critical
    message: Deletes an ElastiCache cluster, replication group or serverless cache. Check for a final snapshot before approving.
  - id: aws.redshift.delete-cluster
    hosts: ["redshift.*.amazonaws.com", "redshift-fips.*.amazonaws.com", "redshift.*.api.aws"]
    aws: { actions: [DeleteCluster] }
    resource: "{ClusterIdentifier}"
    severity: critical
    message: Deletes a Redshift cluster. Check SkipFinalClusterSnapshot before approving.
  - id: aws.redshift-serverless.delete
    hosts: ["redshift-serverless.*.amazonaws.com", "redshift-serverless-fips.*.amazonaws.com", "redshift-serverless.*.api.aws"]
    aws: { actions: [DeleteNamespace, DeleteWorkgroup] }
    resource: "{namespaceName|workgroupName}"
    severity: critical
    message: Deletes a Redshift Serverless namespace (its databases) or workgroup.
  - id: aws.opensearch.delete-domain
    # {api} is "opensearch" (2021-01-01 API) or "es" (legacy Elasticsearch API).
    hosts: ["es.*.amazonaws.com", "es-fips.*.amazonaws.com", "es.*.api.aws"]
    methods: [DELETE]
    path: /{version}/{api}/domain/{domain}
    resource: "{domain}"
    severity: critical
    message: Deletes an OpenSearch Service domain and all of its data.
  - id: aws.kms.schedule-key-deletion
    hosts: ["kms.*.amazonaws.com", "kms-fips.*.amazonaws.com", "kms.*.api.aws"]
    aws: { actions: [ScheduleKeyDeletion] }
    resource: "{KeyId}"
    severity: critical
    message: Schedules a KMS key for deletion; data encrypted under it becomes unrecoverable.
  - id: aws.backup.delete-recovery-point
    # Recovery point ARNs can contain "/" (e.g. EBS snapshot ARNs), hence {arn...}.
    hosts: ["backup.*.amazonaws.com", "backup-fips.*.amazonaws.com", "backup.*.api.aws"]
    methods: [DELETE]
    path: /backup-vaults/{vault}/recovery-points/{arn...}
    resource: "{vault}/{arn}"
    severity: critical
    message: Deletes an AWS Backup recovery point (a backup).
  - id: aws.backup.delete-vault
    hosts: ["backup.*.amazonaws.com", "backup-fips.*.amazonaws.com", "backup.*.api.aws"]
    methods: [DELETE]
    path: /backup-vaults/{vault}
    resource: "{vault}"
    severity: high
    message: Deletes an AWS Backup vault (only succeeds when it is empty).
