<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="twokey interactive replay and phone approval demo">
  <rect width="820" height="280" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect width="820" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="820" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="410" y="23" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">twokey — two-person rule proxy for AI agents</text>
  <text x="24" y="68" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ twokey replay pocketos --live</text>
  <text x="24" y="104" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">  HOLD #1   POST https://backboard.railway.com/graphql/v2</text>
  <text x="24" y="132" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">  CRITICAL  railway.volume.delete   operation=volumeDelete   resource="pg-data-prod"</text>
  <text x="24" y="160" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">  → approve 1 pg-data-prod   |   deny 1</text>
  <text x="24" y="190" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">deny 1</text>
  <text x="24" y="218" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">  #1 DENIED by terminal (agent blocked from self-approving destructive API calls)</text>
  <text x="24" y="252" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">1-line live guard: twokey setup &amp;&amp; twokey run --phone -- claude</text>
</svg>
